# Pull requests that keep the actions, the dependencies and uv up to date: one pull request per
# ecosystem, grouping all its updates. Each waits a week after a release (cooldown), as the
# lockfile does (pyproject.toml, `exclude-newer`): time for a compromised release to be found and
# yanked before it reaches this repository.
version: 2
updates:
  # The SHA-pinned actions of .github/workflows/, in one pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The package's dependencies and tools (pyproject.toml, uv.lock), in one pull request.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: pip
    # .github/ci-requirements.txt: uv, with its hashes, for the workflows.
    directory: /.github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      pip:
        patterns: ["*"]
